name: Android CI

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that need no emulator: lint, unit tests and the debug build.
  checks:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches Gradle dependencies and build outputs between runs, which also makes
      # transient Maven download failures much rarer.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload lint and unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  # Compose UI tests on an emulator; runs in parallel with the checks above.
  ui-tests:
    name: UI tests (API 29 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the emulator; without it the emulator is several times slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator cold-boots on every run (-no-snapshot). Booting from a cached snapshot was
      # faster, but now and then it came up half-started ("No service published for: input"),
      # failed, and then hung the step until the job timeout - even with a freshly made snapshot.
      - name: UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload UI test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
