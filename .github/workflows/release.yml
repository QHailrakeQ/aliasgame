name: Release

# Pushing a version tag (for example `git tag v1.2 && git push origin v1.2`) builds the app
# and publishes a GitHub Release with the APK and notes generated from the merged pull requests.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The same gate as CI: a tag on broken code must not become a release.
      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest

      # The project has no release signing key yet, so the release ships the debug build.
      # Once a keystore is stored in the repository secrets, switch this to assembleRelease.
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "AliasGame-${TAG#v}-debug.apk"
          gh release create "$TAG" "AliasGame-${TAG#v}-debug.apk" \
            --title "AliasGame ${TAG#v}" \
            --generate-notes \
            --verify-tag
